[theme]
# A vibrant coral/salmon color for buttons and accents (pops beautifully)
primaryColor = "#FF6B6B"

# A very light, cool grey/blue for the main background (cleaner than pure white)
backgroundColor = "#F8F9FA"

# A deep indigo/navy for the sidebar to make it look premium
secondaryBackgroundColor = "#1E293B"

# Dark slate for the main text, and the sidebar text will automatically adjust to white!
textColor = "#334155"

font = "sans serif"
